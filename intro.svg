<svg xmlns="http://www.w3.org/2000/svg" width="560" height="270" viewBox="0 0 560 270" role="img" aria-label="Hey, I'm Nikhil. Full-Stack Developer and B.Tech IT student." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/><stop offset="0.55" stop-color="#a371f7"/><stop offset="1" stop-color="#f778ba"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; }
      .txt  { fill: #24292f; }
      .mut  { fill: #57606a; }
      .role { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; fill: #0969da; }
      .cursor { fill: #0969da; }
      @media (prefers-color-scheme: dark) {
        .txt { fill: #e6edf3; } .mut { fill: #8b949e; }
        .role { fill: #79c0ff; } .cursor { fill: #79c0ff; }
      }
    </style>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="558" height="268" rx="12" fill="#8b949e" fill-opacity="0.08" stroke="#8b949e" stroke-opacity="0.45" stroke-width="1.5"/>
  <path d="M1 34 H559" stroke="#8b949e" stroke-opacity="0.3"/>
  <circle cx="22" cy="18" r="5.5" fill="#ff5f56"/><circle cx="41" cy="18" r="5.5" fill="#ffbd2e"/><circle cx="60" cy="18" r="5.5" fill="#27c93f"/>
  <text class="mono mut" x="280.0" y="22" font-size="12" text-anchor="middle">nikhil@forge: ~/profile</text>

  <!-- who am i -->
  <text class="mono" x="24" y="62" font-size="14"><tspan fill="#3fb950">$</tspan><tspan class="mut" dx="8">whoami</tspan></text>
  <text class="sans" x="24" y="106" font-size="35" font-weight="700" fill="url(#g)">Hey, I'm Nikhil <tspan>👋</tspan></text>
  <text class="sans txt" x="25" y="134" font-size="15.5">Full-Stack Developer &amp; B.Tech IT student</text>

  <!-- currently building (typing) -->
  <text class="mono" x="24" y="172" font-size="14"><tspan fill="#3fb950">$</tspan><tspan class="mut" dx="8">currently --building</tspan></text>
  <text class="mono" x="24" y="198" font-size="15" fill="#a371f7">&gt;</text>
  
  <clipPath id="c0"><rect x="46" y="181" width="0" height="24"><animate attributeName="width" values="0;306;306;0;0" keyTimes="0;0.125;0.275;0.3333;1" dur="12.0s" repeatCount="indefinite"/></rect></clipPath>
  <text class="role" x="46" y="198" textLength="306" lengthAdjust="spacingAndGlyphs" clip-path="url(#c0)">RESTful backends &amp; full-stack apps</text>
  <g opacity="1"><animate attributeName="opacity" calcMode="discrete" values="1;0;0" keyTimes="0;0.3333;1" dur="12.0s" repeatCount="indefinite"/><rect class="cursor" x="46" y="183" width="8" height="19" rx="1"><animate attributeName="x" values="46;352;352;46;46" keyTimes="0;0.125;0.275;0.3333;1" dur="12.0s" repeatCount="indefinite"/><animate attributeName="opacity" calcMode="discrete" values="1;0" keyTimes="0;0.5" dur="0.9s" repeatCount="indefinite"/></rect></g>
  <clipPath id="c1"><rect x="46" y="181" width="0" height="24"><animate attributeName="width" values="0;0;279;279;0;0" keyTimes="0;0.3333;0.4583;0.6083;0.6667;1" dur="12.0s" repeatCount="indefinite"/></rect></clipPath>
  <text class="role" x="46" y="198" textLength="279" lengthAdjust="spacingAndGlyphs" clip-path="url(#c1)">AI-powered tools &amp; Discord bots</text>
  <g opacity="1"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.3333;0.6667;1" dur="12.0s" repeatCount="indefinite"/><rect class="cursor" x="46" y="183" width="8" height="19" rx="1"><animate attributeName="x" values="46;46;325;325;46;46" keyTimes="0;0.3333;0.4583;0.6083;0.6667;1" dur="12.0s" repeatCount="indefinite"/><animate attributeName="opacity" calcMode="discrete" values="1;0" keyTimes="0;0.5" dur="0.9s" repeatCount="indefinite"/></rect></g>
  <clipPath id="c2"><rect x="46" y="181" width="0" height="24"><animate attributeName="width" values="0;0;324;324;0" keyTimes="0;0.6667;0.7917;0.9417;1" dur="12.0s" repeatCount="indefinite"/></rect></clipPath>
  <text class="role" x="46" y="198" textLength="324" lengthAdjust="spacingAndGlyphs" clip-path="url(#c2)">interactive UIs &amp; custom web systems</text>
  <g opacity="1"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.6667;1" dur="12.0s" repeatCount="indefinite"/><rect class="cursor" x="46" y="183" width="8" height="19" rx="1"><animate attributeName="x" values="46;46;370;370;46" keyTimes="0;0.6667;0.7917;0.9417;1" dur="12.0s" repeatCount="indefinite"/><animate attributeName="opacity" calcMode="discrete" values="1;0" keyTimes="0;0.5" dur="0.9s" repeatCount="indefinite"/></rect></g>

  <!-- status -->
  <circle cx="30" cy="243" r="4" fill="#3fb950">
    <animate attributeName="r" values="4;11" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;0" dur="1.8s" repeatCount="indefinite"/></circle>
  <circle cx="30" cy="243" r="4" fill="#3fb950"/>
  <text class="sans mut" x="44" y="247.5" font-size="13">Open to internships · hackathons · collaborations</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
